<style>
/* ═══════════════════════════════════════════════════════════
   THE WATER JOURNAL — written from scratch.
   Two rules held throughout:
     1. Every figure comes from the engine. None is typed here.
     2. Every word of editorial prose is the editor's. The site
        supplies structure, labels and arithmetic — nothing else.
   ═══════════════════════════════════════════════════════════ */
:root{
  color-scheme:light only;
  --pure:#F8F8F5; --snow:#F2F4F2; --ice:#E6EAE8; --rule:#D8DDDC;
  --ink:#2F3438; --body:#3F4449; --quiet:#6E757B; --faint:#A0A6AB;
  --prana:#00B1AE; --edit:#19B7C4; --paper:#FFFFFF;
  /* The published accent is a rule-and-bar colour, not a text colour. On white
     #19B7C4 measures 2.44:1 and #00B1AE 2.66:1, where AA wants 4.5 for small
     text and 3.0 for large — so both fail at every size. This is the same hue
     taken down until it passes on white (5.29) and on Snow White (4.78). It is
     used wherever the accent carries words; the published values keep every
     rule, bar, dot and border, which carry no text and are held to nothing. */
  --edit-text:#107780; --arctic:#8FD5DF; --glacier:#C7EAF2;

  --micro:12.5px;
  --small:clamp(15px,3.9vw,16px);
  --ui:clamp(16.5px,4.3vw,17.5px);
  --read:clamp(19px,5vw,20px);
  --lead:clamp(21px,5.6vw,25px);
  --h3:clamp(22px,5.8vw,27px);
  --h2:clamp(26px,7vw,36px);
  --h1:clamp(33px,9vw,58px);
  --display:clamp(38px,11vw,72px);

  /* Brand book §06: Outfit is the official face and the only one. Poppins is a
     technical fallback, not part of the identity, and a second editorial serif
     is forbidden — the site was set in the fallback plus the forbidden serif. */
  --sans:'Outfit','Poppins',-apple-system,system-ui,sans-serif;
  --serif:'Outfit','Poppins',-apple-system,system-ui,sans-serif;
  --navh:52px;
}
@media (prefers-color-scheme:dark){html,body{background:#F8F8F5!important;color:#3F4449!important}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--pure);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{background:var(--pure);color:var(--body);font-family:var(--sans);font-weight:400;
     line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
/* Every destination on this site is a link with a real href, so it can be
   copied, opened in a tab, cited and crawled. Nothing navigates by script
   alone. */
a[data-route]{cursor:pointer}
.link[data-route]{display:inline-flex}
.posterlink{display:block}
img{max-width:100%;display:block}
/* Bright turquoise is for lines, dots, bars and underlines. Anything that
   carries meaning as text or as a state indicator uses --edit-text, which
   clears 4.5:1 on white; PRANA #00B1AE measures 2.66:1 and a focus ring a
   keyboard user cannot see is not a focus ring. */
:focus-visible{outline:2px solid var(--edit-text);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(22px,4vw,32px)}
.col{max-width:680px;margin:0 auto;padding:0 clamp(22px,4vw,32px)}
.bleed{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw)}

.top{padding:clamp(24px,3.6vw,40px) 0 0;text-align:center}
.brand{display:inline-flex;flex-direction:column;align-items:center;gap:13px}
.brand img{width:clamp(38px,4.4vw,50px)}
.brand span{font-size:clamp(12px,1.7vw,15px);letter-spacing:.4em;text-indent:.4em;
            text-transform:uppercase;color:var(--ink)}
.hr{width:38px;height:2px;background:var(--rule);border:0;margin:18px auto 12px}
.kick{font-size:var(--micro);letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;
       color:var(--edit-text)}
@media(max-width:430px){.kick{letter-spacing:.16em;text-indent:.16em}}
nav{margin-top:clamp(22px,3.4vw,36px);border-top:1px solid var(--ice);border-bottom:1px solid var(--ice);
    position:sticky;top:0;background:var(--pure);z-index:30}
nav .wrap{position:relative}
.navrow{display:flex;justify-content:center;gap:clamp(14px,4vw,46px);padding:16px 0;
         overflow-x:auto;scrollbar-width:none}
@media(max-width:430px){
  .navrow{gap:13px}
  .navrow a{letter-spacing:.09em;font-size:11.5px}
}
/* On the narrowest phones the row fits the screen but not the page gutters,
   so it steps outside them and pads itself instead. Three items should never
   scroll: a hidden scrollbar cutting METHODOLOGY mid-word tells the reader
   the word is METHODOLO. */
@media(max-width:374px){
  .navrow{gap:7px;margin-inline:calc(-1*clamp(22px,4vw,32px));padding-inline:6px}
  .navrow a{letter-spacing:0;font-size:10.5px}
}
/* iPhone SE, first generation, and anything narrower. The last seven pixels
   come from the row's own padding: at this width there is nothing beside it
   to be flush with. */
@media(max-width:330px){.navrow{gap:6px;padding-inline:0}}
.navrow::-webkit-scrollbar{display:none}
.navrow a{flex:0 0 auto;font-size:var(--micro);letter-spacing:.22em;text-transform:uppercase;
               color:var(--quiet);padding:4px 0;border-bottom:1px solid transparent;white-space:nowrap;transition:color .3s}
/* The word is 12px tall and the underline has to stay tight to it, so the
   hit area is grown rather than the box: an invisible ::after inset takes the
   tap to about 44px without moving a pixel of the rule. */
.navrow a{position:relative}
.navrow a::after{content:"";position:absolute;left:-6px;right:-6px;top:-14px;bottom:-14px}
.navrow a:hover{color:var(--ink)}
.navrow a[aria-current]{color:var(--ink);border-bottom-color:var(--edit)}
.navmark{position:absolute;left:0;top:50%;width:22px;margin-top:-11px;opacity:0;transition:opacity .3s;cursor:pointer}
.navmark.on{opacity:1}
@media(max-width:680px){.navmark{display:none}}
/* Cards written into the page before any script runs. Once the router boots
   it repaints the container and these are gone, so they only need to be
   legible, not styled to match. */
.nscard{padding:18px 0;border-bottom:1px solid var(--ice)}
.nscard .r{font-size:var(--micro);letter-spacing:.2em;text-transform:uppercase;color:var(--edit-text)}
.nscard h3{font-size:var(--h3);margin:8px 0}
.nscard p{color:var(--body);max-width:60ch}
.nscard .m{font-size:var(--small);color:var(--quiet);margin-top:8px}
.map .land{fill:var(--snow);stroke:#E3E7E8;stroke-width:.4;stroke-linejoin:round}
.progress{position:fixed;top:0;left:0;height:2px;background:var(--prana);width:0;z-index:40}

.page{display:none;padding-bottom:clamp(72px,10vw,110px)}
.page.on{display:block;animation:in .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:300;color:var(--ink);letter-spacing:-.016em;line-height:1.16}
.eyebrow{font-size:var(--micro);letter-spacing:.28em;text-transform:uppercase;color:var(--quiet)}
.link{font-size:var(--micro);letter-spacing:.2em;text-transform:uppercase;color:var(--edit-text);
      display:inline-flex;align-items:center;gap:9px;min-height:36px}
.link .a{transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.link:hover .a{transform:translateX(4px)}
.hist{display:block;margin-top:10px;color:var(--quiet);font-size:var(--micro);letter-spacing:0;text-transform:none}
.note{margin-top:20px;font-size:var(--small);line-height:1.8;color:var(--quiet);max-width:62ch}
.note b{font-weight:500;color:var(--ink)}
.hero{padding:clamp(40px,6.5vw,86px) 0 clamp(24px,3.6vw,44px)}
.hero h1{margin-top:20px;font-size:var(--h1);max-width:18ch}
/* The colour lands on the subject of the publication, not on the sentence.
   The covers already work this way — Seven Point Four sets its second line in
   turquoise and its first in graphite — so this is the brand's own practice
   brought to the front door rather than a new idea.
   It is --edit-text and not PRANA #00B1AE, which measures 2.66:1 on white and
   fails even the 3.0 that display type is allowed. */
.statement h1 em{font-style:normal;color:var(--edit-text)}
.hero p{margin-top:20px;font-size:var(--ui);line-height:1.75;max-width:50ch}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:var(--micro);letter-spacing:.18em;
     text-transform:uppercase;color:var(--quiet)}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--rule);flex:none;display:block}
.tag.a{color:var(--edit-text)} .tag.a i{background:var(--prana)}
.tag.b i{background:var(--arctic)}
.tag.c i{background:transparent;border:1px solid var(--faint)}
.na{font-family:var(--serif);font-style:italic;color:var(--faint)}
.blk{padding:clamp(32px,5vw,60px) 0 0}
.blk h4{font-size:var(--micro);letter-spacing:.26em;text-transform:uppercase;color:var(--quiet);
        margin-bottom:20px;font-weight:400}
.rows{border-top:1px solid var(--ice)}
.rows>div{display:grid;grid-template-columns:minmax(140px,32%) 1fr;gap:18px;padding:15px 0;
          border-bottom:1px solid var(--ice);font-size:var(--ui);align-items:baseline}
.rows .a{font-size:var(--micro);letter-spacing:.18em;text-transform:uppercase;color:var(--quiet)}
@media(max-width:680px){.rows>div{grid-template-columns:1fr;gap:5px}}

.statement{padding:clamp(46px,8vw,104px) 0 clamp(32px,5vw,60px);border-bottom:1px solid var(--ice)}
.statement h1{font-size:var(--display);line-height:1.1;max-width:14ch}
.statement p{margin-top:24px;font-size:var(--ui);line-height:1.75;max-width:46ch}
.lead{padding:clamp(28px,4.5vw,54px) 0 0}
.lead .k{font-size:var(--micro);letter-spacing:.22em;text-transform:uppercase;color:var(--quiet)}
.lead h2{margin-top:16px;font-size:var(--h2);max-width:18ch}
.lead p{margin-top:16px;font-family:var(--serif);font-size:var(--lead);line-height:1.5;max-width:34ch;color:var(--body)}
/* Column, not row. As a flex row the caption became the image's neighbour
   rather than its caption — a credit line reading down a narrow gutter beside
   the photograph it belongs to. */
.poster{background:var(--snow);border-top:1px solid var(--ice);border-bottom:1px solid var(--ice);
        display:flex;flex-direction:column;align-items:center;
        padding:clamp(20px,3.5vw,42px) 0;margin-top:clamp(26px,4vw,44px)}
.poster img{width:auto;max-width:min(520px,84vw);max-height:74svh;box-shadow:0 18px 44px -30px rgba(47,52,56,.4)}
/* An image whose provenance is stated is held to the same standard as a figure.
   A satellite photograph is somebody's data, taken over a real place, and both
   belong under it — quietly. A credit competing with the headline is a caption
   that has forgotten what it is for. */
/* Deliberately narrower than the image's own ceiling of min(520px,84vw), so
   the caption always sits inside the picture's edges instead of overhanging
   them by a few pixels — which reads as a mistake rather than a margin. */
.poster figcaption{width:min(492px,79vw);margin-top:14px;font-size:12.5px;line-height:1.6;color:var(--quiet);
                   letter-spacing:.01em;text-align:left;text-wrap:pretty}
.poster figcaption b{color:var(--ink);font-weight:500;letter-spacing:.04em}
@media(max-width:680px){.poster img{max-width:min(430px,82vw);max-height:68svh}}
.sect{border-top:1px solid var(--ice);padding:clamp(30px,4.5vw,54px) 0 0;margin-top:clamp(30px,4.5vw,54px)}
.sect .h{display:flex;justify-content:space-between;align-items:baseline;gap:18px;flex-wrap:wrap}
.sect .h b{font-size:var(--h3);font-weight:300;color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ice);
       border-top:1px solid var(--ice);border-bottom:1px solid var(--ice);margin-top:22px}
.strip a{display:block;background:var(--pure);padding:clamp(18px,2.4vw,26px);transition:background .25s}
.strip a:hover{background:var(--snow)}
.strip .c{font-size:var(--micro);letter-spacing:.2em;text-transform:uppercase;color:var(--quiet)}
.strip .v{margin-top:12px;font-size:clamp(21px,5.2vw,28px);color:var(--ink);font-weight:300;letter-spacing:-.02em}
.strip .u{margin-top:8px;font-size:var(--micro);color:var(--quiet)}
@media(max-width:760px){.strip{grid-template-columns:1fr 1fr}}

.alist{border-top:1px solid var(--ice);margin-top:20px}
.alist a{display:grid;grid-template-columns:118px 1fr;gap:clamp(18px,3.4vw,28px);width:100%;
              padding:clamp(22px,4.4vw,30px) 0;border-bottom:1px solid var(--ice);align-items:start;transition:background .25s}
.alist a:hover{background:var(--snow)}
.alist a:hover h3{color:var(--prana)}
.alist .th{aspect-ratio:4/5;background:var(--snow);overflow:hidden}
.alist .th img{width:100%;height:100%;object-fit:cover}
.alist .r{font-size:var(--micro);letter-spacing:.2em;text-transform:uppercase;color:var(--quiet)}
.alist h3{margin-top:11px;font-size:var(--h3);font-weight:400;transition:color .25s}
.alist p{margin-top:10px;font-size:var(--small);line-height:1.65;color:var(--body);max-width:50ch}
.alist .m{display:block;margin-top:13px;font-size:var(--micro);letter-spacing:.18em;
          text-transform:uppercase;color:var(--quiet)}
@media(max-width:680px){.alist a{grid-template-columns:92px 1fr}}

/* The Journal's opening: the newest piece at the size its cover was made for.
   Below it the archive stays compact — discovery, then filing. */
.latest{display:grid;grid-template-columns:1fr;gap:clamp(20px,3vw,34px);margin-top:clamp(20px,3vw,30px);
        padding-bottom:clamp(28px,4.5vw,44px);border-bottom:1px solid var(--ice)}
.latest .c{display:block;background:var(--snow);overflow:hidden;aspect-ratio:4/5;max-height:62svh}
.latest .c img{width:100%;height:100%;object-fit:cover;display:block}
.latest .r{font-size:var(--micro);letter-spacing:.2em;text-transform:uppercase;color:var(--quiet)}
.latest h2{margin-top:14px;font-size:var(--h2);font-weight:400;letter-spacing:-.02em;transition:color .25s}
.latest:hover h2{color:var(--prana)}
.latest p{margin-top:14px;font-size:var(--lead);line-height:1.5;color:var(--body);max-width:36ch;font-weight:300}
.latest .m{display:block;margin-top:16px;font-size:var(--micro);letter-spacing:.18em;
           text-transform:uppercase;color:var(--quiet)}
@media(min-width:820px){
  .latest{grid-template-columns:minmax(0,42%) 1fr;align-items:center;gap:clamp(30px,4vw,54px)}
  .latest .t{padding-right:clamp(10px,2vw,30px)}
}

/* The rubric bar scrolls and its scrollbar is hidden, so on a narrow screen
   nothing said there was more to the right. A fade is the smallest thing that
   can say it — no arrows, no carousel. */
.secwrap{position:relative}
.secwrap:after{content:'';position:absolute;top:0;bottom:1px;right:0;width:46px;pointer-events:none;
               background:linear-gradient(90deg,rgba(248,248,245,0) 0%,var(--pure) 82%)}
@media(min-width:820px){.secwrap:after{display:none}}

@media(max-width:420px){
  .secbar a,.secbar .off,.alist .r,.alist .m,.latest .r,.latest .m,.strip .c,.eyebrow{letter-spacing:.14em}
  .body .notes h4,.body .notes h5,.body h4{letter-spacing:.16em}
}
.gradekey{margin-top:14px;max-width:58ch}
.actions{display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,40px)}
.gradekey b{color:var(--ink);font-weight:500}
.gradekey .link{margin-left:6px}
/* The 1px gaps are the container's background showing through, which is neat
   until a row is short: auto-fit gave five columns for six tiles on a tablet,
   and the four empty cells painted as one grey slab beside a lone Earth.
   Fixed columns that divide the tile count, and a last-child that stretches to
   fill whatever remainder is left — so a rubric added or retired later cannot
   reopen the hole. */
/* The block above already closes with a rule, and this grid was drawing its own
   8px below it — two hairlines with a sliver of paper between, which reads as a
   printing fault rather than a border. It borrows the neighbour's line and keeps
   only its own closing edge. */
.sections{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ice);
          border-bottom:1px solid var(--ice)}
.sections>:last-child:nth-child(3n+1){grid-column:span 3}
.sections>:last-child:nth-child(3n+2){grid-column:span 2}
@media(max-width:620px){
  .sections{grid-template-columns:repeat(2,1fr)}
  .sections>:last-child:nth-child(3n+1),
  .sections>:last-child:nth-child(3n+2){grid-column:auto}
  .sections>:last-child:nth-child(2n+1){grid-column:span 2}
}
.sections a,.sections .off{background:var(--pure);padding:22px 20px;transition:background .3s;display:block}
.sections a:hover{background:var(--snow)}
/* Dimmed means "there is nothing here". An empty rubric earns that; the view
   the reader is currently in does not, and styling both the same made the
   whole-journal link look broken. */
.sections .off{opacity:.4;cursor:default}
.sections a[aria-current]{background:var(--snow);box-shadow:inset 2px 0 0 var(--prana)}
.sections .nm{font-size:var(--h3);color:var(--ink);letter-spacing:-.01em}

.sections .ln{display:block;margin-top:10px;font-size:var(--small);line-height:1.6;color:var(--body);max-width:32ch}
.secbar{display:flex;flex-wrap:nowrap;border-bottom:1px solid var(--ice);overflow-x:auto;scrollbar-width:none;
        position:sticky;top:var(--navh);background:var(--pure);z-index:20}
.secbar::-webkit-scrollbar{display:none}
.secbar a,.secbar .off{flex:0 0 auto;padding:16px 24px 15px 0;font-size:var(--micro);letter-spacing:.18em;
               text-transform:uppercase;color:var(--quiet);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
/* The word takes the readable tone; the underline keeps the published one. */
.secbar a.on{color:var(--edit-text);border-bottom-color:var(--prana)}
.secbar .off{opacity:.35}
.secbar .ct{margin-left:8px;color:var(--faint)}
.secbar .all{padding-right:28px;margin-right:8px;border-right:1px solid var(--ice)}
.sechead{padding:clamp(32px,7vw,60px) 0 clamp(20px,3.4vw,30px);border-bottom:1px solid var(--ink)}
.sechead h1{font-size:var(--display);line-height:1.04}
.sechead p{margin-top:16px;font-size:var(--lead);line-height:1.45;max-width:36ch;color:var(--body);font-weight:300}
.sechead .ct{margin-top:20px;font-size:var(--micro);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}

/* ═══ THE ARTICLE PAGE ═════════════════════════════════════════════════════
   White ground, one family, and a hierarchy a reader can navigate by eye.

   The article ran on the site's warm Pure White with body copy in a serif the
   brand book forbids. Both are corrected here. Reading pages are paper white;
   the rest of the site keeps Pure White, so the article reads as the page and
   the index reads as the instrument.

   Where emphasis is carried by colour it is PRANA Turquoise for the brand's own
   marks and Editorial Turquoise for editorial ones — never on running copy,
   which the brand book rules out, and always on something short: a number, a
   label, a rule, the first words of a pull quote. */
.art{background:var(--paper)}
#p-article.on{background:var(--paper)}
/* The poster is Snow White on the home and journal pages, where it sits inside
   a listing. On an article it is the first thing on the reading page, and a
   seam between the image band and the text below would say the two are
   different objects when they are one. */
.art .poster{background:var(--paper);border-top:0}
.art .poster figcaption b{color:var(--ink)}
.art .back{padding:clamp(24px,4vw,42px) 0 0}
.art h1{margin-top:14px;font-size:var(--h1);font-weight:500;letter-spacing:-.028em;color:var(--ink)}
.art .stand{margin-top:20px;font-size:var(--lead);line-height:1.42;color:var(--ink);font-weight:300;max-width:30ch}
.art .formula{margin-top:16px;font-size:clamp(21px,5.4vw,28px);color:var(--ink);font-weight:300}
.art .meta{margin-top:26px;padding:15px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);
           display:flex;flex-wrap:wrap;gap:20px;font-size:var(--micro);letter-spacing:.18em;
           font-weight:500;text-transform:uppercase;color:var(--quiet)}

.body{font-family:var(--sans);color:#3A4045;margin-top:clamp(30px,5vw,50px)}
.body p{font-size:var(--read);line-height:1.74;margin-top:1.1em;max-width:33em;font-weight:300}

/* The standfirst is the deck; this is the piece opening its own case. */
.body>p:first-of-type{font-size:calc(var(--read)*1.14);line-height:1.55;color:var(--ink);
                      font-weight:400;margin-top:0;max-width:30em}

<script>
const D=JSON.parse(document.getElementById('payload').textContent);
const CITIES=D.cities, ART=D.articles, RUB=Object.fromEntries(D.rubrics.map(r=>[r.id,r]));
const byId=id=>CITIES.find(c=>c.id===id);
const rubName=id=>RUB[id]?RUB[id].name:id;
const LOGO=D.brand&&D.brand.mark?D.brand.mark:'';
const MIX={surface_water:'#8FD5DF',groundwater:'#C7EAF2',desalination:'#00B1AE',reuse:'#0CA7B8',
           imported_water:'#D8DDDC',local_catchment:'#8FD5DF',reclaimed_water_newater:'#0CA7B8'};
const MIXL={surface_water:'Surface',groundwater:'Groundwater',desalination:'Desalination',reuse:'Reuse',
            imported_water:'Imported',local_catchment:'Catchment',reclaimed_water_newater:'NEWater'};
const tag=c=>`<span class="tag ${c.grade.toLowerCase()}"><i></i>Grade ${c.grade}</span>`;
/* A letter with no key is a letter. Wording is Rule 5.2's, unshortened: the
   grade measures the uncertainty in the figure, not the quality of the city. */
const GRADEL={
  A:'no material assumption \u2014 the figure may be sorted, ranked and compared',
  B:'one disclosed assumption, under 1% of the bill \u2014 comparable, with the assumption printed',
  C:'over 1%, or a tariff that cannot be standardized \u2014 shown as context or a range, never ranked'};
const gradeNote=c=>`<p class="note gradekey"><b>Grade ${c.grade}</b> \u2014 ${GRADEL[c.grade]||''}.
  <a class="link" href="${href('/methodology')}" data-route="/methodology">How the grade is set ${ARR}</a></p>`;
const ARR='<span class="a">→</span>';

/* ── Routing ────────────────────────────────────────────────────────────────
   Every view has an address. The build writes one static file per address, so
   /city/dubai is a page a reader can bookmark, a colleague can be sent, and a
   crawler can fetch — not a state this script happens to be in.

   Opened from disk there is no server to resolve those paths, so the same
   routes run off the hash instead. One route table, three transports — and the
   third one is the reason this comment is longer than it was.

   The single preview file gets opened in places that are neither a server nor
   a filesystem: a sandboxed iframe, a data: URL, an in-app document viewer.
   In a srcdoc frame `location.pathname` reads "srcdoc", which resolved to no
   route and rendered a 404, and `history.pushState` throws on an opaque
   origin, which killed every click. Detecting `file:` and assuming everything
   else was a server was the bug.

   So the transport is not guessed from the protocol. It is tested:

     push    a real server, and pushState is actually permitted
     hash    no server, but the address bar can hold a fragment
     memory  neither — the route lives in a variable and the page still works

   Degrading to memory costs the back button. Guessing wrong costs the site. */
const ROOT=D.site&&D.site.base_path?D.site.base_path:'/';
const ORIGIN=D.site&&D.site.origin?D.site.origin:'';

let MODE=(function(){
  try{
    if(/^https?:$/.test(location.protocol)){
      /* Permission is not implied by the scheme. Ask. */
      history.replaceState(history.state,'',location.href);
      return 'push';
    }
    if(location.protocol==='file:') return 'hash';
  }catch(e){}
  return 'memory';
})();

const href=r=>MODE==='push'?((ROOT.replace(/\/$/,'')+r)||'/'):('#'+r);
const canonical=r=>ORIGIN?ORIGIN+((ROOT.replace(/\/$/,'')+r)||'/'):'';

const PAGES=[['/journal','Journal'],['/water-index','Water Index'],['/methodology','Methodology']];
const KICK={home:'The world, explained through water',journal:'Stories',article:'',
            index:'What water costs, and why',city:'City record',compare:'Compare',
            method:'How we measure water',about:'Ownership and independence',
            '404':'Not found'};
const nav=document.getElementById('nav');
PAGES.forEach(function(p){const a=document.createElement('a');a.textContent=p[1];
  a.href=href(p[0]);a.dataset.route=p[0];nav.appendChild(a);});

let CURRENT='/';
function show(id,route){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));
  nav.querySelectorAll('a').forEach(a=>route&&(a.dataset.route===route
    ||(a.dataset.route!=='/'&&route.indexOf(a.dataset.route+'/')===0))
    ?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  document.getElementById('kick').textContent=KICK[id]||'';
}

/* The head is part of the page, so it changes when the page does. */
function head(title,desc,image,type){
  document.title=title;
  const set=(sel,attr,val)=>{const el=document.querySelector(sel);if(el&&val!=null)el.setAttribute(attr,val);};
  set('meta[name="description"]','content',desc);
  set('meta[property="og:title"]','content',title);
  set('meta[name="twitter:title"]','content',title);
  set('meta[property="og:description"]','content',desc);
  set('meta[name="twitter:description"]','content',desc);
  set('meta[property="og:type"]','content',type||'website');
  if(image){set('meta[property="og:image"]','content',image);set('meta[name="twitter:image"]','content',image);}
  const c=canonical(CURRENT);
  if(c){set('link[rel="canonical"]','href',c);set('meta[property="og:url"]','content',c);}
}

function navigate(route,opts){
  opts=opts||{};
  if(route===CURRENT&&!opts.force) return;
  if(MODE==='push'&&!opts.silent){
    try{ history[opts.replace?'replaceState':'pushState']({},'',href(route)); }
    /* A transport that fails once will fail again. Drop to memory and keep
       the site usable rather than throwing on every subsequent click. */
    catch(e){ MODE='memory'; }
  } else if(MODE==='hash'){
    if(location.hash.slice(1)!==route){
      try{ location.hash=route; return; }catch(e){ MODE='memory'; }
    }
  }
  paint(route,opts);
}

function readRoute(){
  if(MODE==='memory') return '/';
  if(MODE==='hash') return location.hash.slice(1)||'/';
  let p=location.pathname;
  if(ROOT!=='/'&&p.indexOf(ROOT)===0) p=p.slice(ROOT.length-1);
  p=p.replace(/index\.html$/,'').replace(/\/+$/,'');
  return p||'/';
}

function paint(route,opts){
  try{ return paintRoute(route,opts); }
  catch(e){
    /* A view that throws must not leave a blank page with no way out. */
    console.error(e);
    gone(route);
  }
}

function paintRoute(route,opts){
  opts=opts||{};
  CURRENT=route;
  const seg=route.split('/').filter(Boolean);
  let ok=true;
  if(!seg.length) home();
  else if(seg[0]==='journal') ok=journal(seg[1]||'all');
  else if(seg[0]==='article') ok=article(seg[1]);
  else if(seg[0]==='city') ok=city(seg[1]);
  else if(seg[0]==='water-index') indexPage();
  else if(seg[0]==='compare') comparePage();
  else if(seg[0]==='methodology') methodPage();
  else if(seg[0]==='independence') aboutPage();
  else ok=false;
  if(!ok) gone(route);
  delink();
  if(!opts.keepScroll) window.scrollTo({top:0,behavior:'instant'});
  /* A screen reader is told the page changed; a sighted reader sees it. */
  if(!opts.initial) document.getElementById('main').focus({preventScroll:true});
}

addEventListener('popstate',()=>paint(readRoute(),{silent:true}));
addEventListener('hashchange',()=>{if(MODE==='hash')paint(readRoute());});

/* Capture phase, and the event stops here. In an embedded viewer the host page
   also listens for taps on anchors and offers to open them externally; a route
   that never leaves this document must not reach that listener at all. */
document.addEventListener('click',function(e){
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
  const t=e.target.closest('[data-trace]');
  if(t){e.preventDefault();e.stopPropagation();drawer(t.dataset.trace,t);return;}
  const a=e.target.closest('[data-route]');
  if(!a||a.target==='_blank') return;
  e.preventDefault(); e.stopPropagation();
  navigate(a.dataset.route);
},true);

/* Without an href an anchor is no longer keyboard-operable, so the keyboard
   contract is restored explicitly rather than lost with the attribute. */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  const a=e.target.closest&&e.target.closest('[data-route]:not([href])');
  if(!a) return;
  e.preventDefault();
  navigate(a.dataset.route);
});

/* Where a path cannot be navigated to, the href is removed rather than left
   pointing somewhere misleading. A real address is only advertised as one when
   the address really resolves — which is exactly when MODE is push. */
function delink(){
  if(MODE==='push') return;
  document.querySelectorAll('a[data-route][href]').forEach(function(a){
    a.removeAttribute('href');
    a.setAttribute('role','link');
    a.tabIndex=0;
  });
}

/* journal */
function journal(filter){
  filter=filter||'all';
  if(filter!=='all'&&!RUB[filter]) return false;
  const sel=filter==='all'?ART:ART.filter(a=>a.rubric===filter), r=RUB[filter];
  /* The Journal opens with the newest piece at cover size, then the archive.
     A publication with strong covers that shows them at 118 px is filing, not
     publishing. Counts are not printed: with a small archive "Science 1" says
     more about the age of the title than about the section. */
  /* Two pieces published on one day tie on date, and the tie was being broken
     by the order the files happened to be read in. The editor's first card
     decides it instead; ART[0] is the fallback when no card is set. */
  const latest=(D.stories&&D.stories.cards||[]).map(k=>ART.find(a=>a.slug===k.slug)).find(Boolean)||ART[0];
  document.getElementById('journalBody').innerHTML=
   (filter==='all'
    ? `<div class="hero"><div class="eyebrow">The Journal</div>
        <h1>Stories about the systems, science and ideas hidden inside water.</h1></div>
       ${latest?`<a class="latest" href="${href('/article/'+latest.slug)}" data-route="/article/${latest.slug}">

            <span class="m">${latest.minutes} min read</span></span></a>`:''}
       <div class="sections">
        <a href="${href('/journal')}" data-route="/journal" aria-current="page"><span class="nm">All stories</span>
          <span class="ln">Everything published, newest first.</span></a>
        ${D.rubrics.map(x=>{const n=ART.filter(a=>a.rubric===x.id).length;
          const inner=`<span class="nm">${x.name}</span><span class="ln">${x.line}</span>`;
          return n?`<a href="${href('/journal/'+x.id)}" data-route="/journal/${x.id}">${inner}</a>`

        ${D.rubrics.map(x=>{const n=ART.filter(a=>a.rubric===x.id).length;

                  :`<span class="off">${x.name}</span>`}).join('')}
       </div></div>

   + list(filter==='all'&&latest?sel.filter(a=>a.slug!==latest.slug):sel, filter==='all');

       filter==='all'
        ? 'Stories about the systems, science and ideas hidden inside water.'
        : r.line,
       null,'website');
  show('journal',filter==='all'?'/journal':'/journal/'+filter);
  return true;
}

function indexPage(){
  let g='';
  for(let lon=-180;lon<=180;lon+=30) g+=`<line class="g" x1="${lon+180}" y1="0" x2="${lon+180}" y2="180"/>`;
  for(let lat=-90;lat<=90;lat+=30) g+=`<line class="g ${lat===0?'eq':''}" x1="0" y1="${90-lat}" x2="360" y2="${90-lat}"/>`;
  /* Dots stay where the coordinates put them; only labels move.
     Abu Dhabi sat one pixel from Dubai and was invisible on the map while being
     present in the table and having its own page — the first reading of "the
     city is not displayed". Toronto and New York are five pixels apart, Hong
     Kong and Singapore nine, and every city added makes this worse.

     Moving a dot would be a lie about geography, so the dodge is applied to the
     label alone: a colliding label is pushed down a line at a time and a hairline
     leader connects it to its own dot. Deterministic — sorted west to east, so
     the same set always renders the same way. */
  /* One line step in SVG units. The map renders at about 0.9 px per unit and a
     label is 5 px tall, so a step of 4.6 left Dubai and Abu Dhabi overlapping by
     a pixel — measured, not guessed. 7 clears it. */
  const LH=7;
  const placed=[];
  const dots=[...CITIES]
    .map(c=>({c,x:c.lon+180,y:90-c.lat}))
    .sort((a,b)=>a.x-b.x||a.y-b.y)
    .map(({c,x,y})=>{
      let ly=y+1.5, side=1, tries=0;
      while(placed.some(p=>Math.abs(p.x-x)<30&&Math.abs(p.ly-ly)<LH*0.85)&&tries<8){
        ly+=LH*side; side=-side; tries++;
      }
      /* Where the label has been pushed off its dot, say which dot it belongs
         to rather than leaving the reader to guess. */
      const leader=Math.abs(ly-(y+1.5))>0.5
        ? `<line class="lead" x1="${x+3.4}" y1="${y}" x2="${x+4.2}" y2="${ly-1.2}"/>` : '';
      placed.push({x,ly});
      return `<a href="${href('/city/'+c.id)}" data-route="/city/${c.id}"><circle class="dot" cx="${x}" cy="${y}" r="2.6"><title>${c.name}</title></circle>
            ${leader}<text class="lb" x="${x+4.8}" y="${ly}">${c.name}</text></a>`;
    }).join('');
  document.getElementById('indexBody').innerHTML=`
  <div class="hero"><div class="eyebrow">TWJ Water Index</div>
    <h1>What does water cost here — and why?</h1>
    <p>One household in every city: 15,000 litres a month, on a meter, ordinary domestic account. The same sum, done the same way, from each city's own published tariff.</p></div>
  <p class="warn"><b>Read down a row, not down the price column.</b> Each price is in that city's own
   currency, so these figures sit in ${new Set(CITIES.filter(c=>!c.not_priced).map(c=>c.currency)).size}
   different units and none is larger or smaller than another. Converting them needs an exchange rate fixed
   to a named month, and none is set. The two proportion columns do compare directly.</p>
  <p class="note gradekey" style="margin-top:22px"><b>The grade measures the figure, not the city.</b>
   <b>A</b> \u2014 no material assumption; may be sorted and compared.
   <b>B</b> \u2014 one disclosed assumption, under 1% of the bill.
   <b>C</b> \u2014 over 1%, or a tariff that cannot be standardized; shown as context, never ranked.</p>
  <div class="thead"><span>City</span><span>1,000 litres &middot; local currency</span><span>Wastewater share</span><span>Cost by volume</span><span>Data</span></div>
  ${CITIES.map(c=>`<a class="trow" href="${href('/city/'+c.id)}" data-route="/city/${c.id}">
    <span class="nm">${c.name}<small>${c.utility}</small></span>
    ${c.not_priced
      ? `<span style="grid-column:2/5"><span class="na">${c.public_headline||'Not yet priced'}${
          c.withholding_reason_public?` — ${c.withholding_reason_public}`:` — ${c.blocked_by}`}</span></span>`
      : `<span><span class="lbl">1,000 litres</span><span class="v num">${c.symbol} ${c.price_m3.toFixed(2)} ${c.symbol.trim()===c.currency?'':`<em class="cur">${c.currency}</em>`}<small>${c.relief?`standing tariff · ${c.symbol} ${c.relief.payable_m3.toFixed(2)} paid today`:`volumetric rate ${c.symbol} ${c.published_m3.toFixed(2)}`}</small></span></span>
         <span><span class="lbl">Wastewater share</span><span class="v num">${c.services_publishable===false||c.ww_share==null?'<span class="na">held</span>':Math.round(c.ww_share)+'%'}<small>of the full bill</small></span></span>
         <span><span class="lbl">Cost by volume</span><span class="v num">${c.curve.ratio>1.01?'+'+Math.round((c.curve.ratio-1)*100)+'%':'flat'}<small>${c.curve.ratio>1.01?'per litre for small households':'same at any volume'}</small></span></span>`}
    <span class="gw">${tag(c)}</span></a>`).join('')}
  <p class="note"><b>No ranking is published.</b> A subsidised tariff makes a bill small without making water cheap to produce.</p>
  <div class="map"><svg viewBox="0 0 360 180" role="img" aria-label="Schematic world map of the cities in the Index; position is latitude and longitude, not price"><path class="land" d="${LAND}"/>${g}${dots}</svg>
    <p class="mapcap"><b>Geography, not price.</b> A dot sits at the city&rsquo;s latitude and longitude. Vertical position is how far north a city is and says nothing about what water costs there &mdash; New York is above Dubai because it is further north. The
      coastline is drawn coarsely and is there to give the dots a place to sit.</p></div>

  ${CITIES.some(c=>c.relief)?`<p class="note"><b>Two prices where relief is live.</b> This table compares standing tariffs, because a city
    under a temporary waiver measured against a city without one measures a budget decision rather than water. Where the two differ,
    what the household actually pays today is printed beneath the tariff and leads that city\u2019s own page.</p>`:''}
  <div class="blk actions">
    <a class="link" href="${href('/compare')}" data-route="/compare">Compare cities side by side ${ARR}</a>
    <a class="link" href="${href('/methodology')}" data-route="/methodology">How every figure is calculated ${ARR}</a>
  </div>`;
  head('Water Index — what a standardized household pays',
       `What 15,000 litres a month costs in ${CITIES.length} cities, each calculated from that city\u2019s own published tariff and shown with its arithmetic, its sources and its comparability grade.`,
       null,'website');
  show('index','/water-index');
}

/* city */
function curve(cv){
  const W=520,H=180,P=36, ys=cv.points.map(p=>p[1]);
  const lo=Math.min(cv.published,...ys)*.97, hi=Math.max(...ys)*1.03;
  const X=v=>P+((v-5)/20)*(W-P-14), Y=v=>H-P-((v-lo)/(hi-lo||1))*(H-P-16);
  return `<div class="curve"><svg viewBox="0 0 ${W} ${H}">
   <line class="pub" x1="${P}" y1="${Y(cv.published).toFixed(1)}" x2="${W-14}" y2="${Y(cv.published).toFixed(1)}"/>
   <text class="ax" x="${W-14}" y="${(Y(cv.published)-7).toFixed(1)}" text-anchor="end">Volumetric rate ${cv.published.toFixed(2)}</text>
   <path d="${cv.points.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="#00B1AE" stroke-width="1.8"/>
   ${cv.points.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${p[0]===15?3.4:2.2}" fill="${p[0]===15?'#2F3438':'#00B1AE'}"/>`).join('')}
   ${cv.points.map(p=>`<text class="ax" x="${X(p[0]).toFixed(1)}" y="${H-12}" text-anchor="middle">${p[0]}</text>`).join('')}
   <text class="ax" x="${P}" y="${H-1}">m³ per month</text></svg></div>`;
}
/* A row with no value is not a row with a value of zero. Nulls are dropped
   from the chart and counted underneath it, because a bar of length nothing
   labelled 0% is a claim, and it is the wrong one. */
function cbar(key,me,label,fmt){
  const all=D.comparables[key]; if(!all||!all.length) return '';
  const rows=all.filter(r=>r.value!=null&&isFinite(r.value)); if(!rows.length) return '';
  const held=all.length-rows.length;
  const max=Math.max.apply(null,rows.map(r=>r.value));
  return `<div class="blk"><h4>${label}</h4><div class="cb">${rows.map(r=>{const m=r.id===me;
    return `<div><span class="n ${m?'me':''}">${byId(r.id).name}</span>
      <span class="bar"><i class="${m?'me':''}" style="width:${(r.value/max)*100}%"></i></span>
      <span class="p ${m?'me':''} num">${fmt(r.value)}</span></div>`}).join('')}</div>
    ${held?`<p class="note">${held} ${held===1?'city is':'cities are'} not shown: the first block is free or
      included, so there is no volumetric rate for the rest of the bill to sit outside of.</p>`:''}</div>`;
}
/* §5.4 — a city under temporary relief has two prices and both are real.
   The page leads with what the household is billed and prints the standing
   tariff beside it, because one figure would be a lie whichever was chosen:
   the payable price answers what water costs a household this month, and the
   structural price is the only one that can be compared with a city that has
   no waiver. The basket takes the structural one and says so. */
function relief(c){
  const r=c.relief, p=r.policies[0]||{};
  return `<div class="blk relief">
    <h4>Two prices, and both are the tariff</h4>
    <div class="duo">
      <div><div class="l">Paid today</div><div class="v num">${c.symbol} ${r.payable_m3.toFixed(2)}</div>
        <div class="u">${c.symbol} ${r.payable_month.toFixed(0)} a month · the headline</div></div>
      <div><div class="l">Standing tariff</div><div class="v num">${c.symbol} ${r.structural_m3.toFixed(2)}</div>
        <div class="u">${c.symbol} ${r.structural_month.toFixed(0)} a month · used for comparison</div></div>
    </div>
    <p class="note">The standing tariff charges ${r.factor.toFixed(2)} times what the household is billed while
    the relief runs${p.from?`, from ${p.from} to ${p.to}`:''}. Nothing was repealed to produce the lower figure:
    ${p.rule?p.rule+'. ':''}${p.funded_by?'It is funded by '+p.funded_by.split('.')[0].toLowerCase()+'. ':''}
    ${p.application_required===false?'No application is required, so it is a feature of the charge rather than a discount somebody claims. ':''}</p>
    ${p.period_note?`<p class="note">${p.period_note}</p>`:''}
    ${p.issuer_characterisation?`<p class="note">The issuer calls it ${p.issuer_characterisation}.${p.repetition_note?' '+p.repetition_note:''}</p>`:''}
    <p class="note"><b>Out of the index basket.</b> ${r.basket_reason.charAt(0).toUpperCase()+r.basket_reason.slice(1)}.
    A frozen base must not embed a policy that will expire while the base does not.</p>
  </div>`;
}

/* Provenance is reported one metric at a time, because it is held one metric
   at a time. A document behind the sewerage rate does not withhold the water
   supply figure, and the page must not say that it does. */
function pubRows(c){
  const st=c.archive_status&&c.archive_status.by_metric;
  /* The gate outranks provenance in this row. Complete provenance and a
     refused city is exactly Singapore's state, and printing "Published"
     against it would contradict the figure withheld above. */
  if(c.gate_problems&&c.gate_problems.length)
    return `<div><span class="a">Publication</span><span>Withheld by the acceptance gate — ${
      c.gate_problems.join('; ')}. Provenance for the figure is complete; what is outstanding is listed here.</span></div>`;
  if(!st) return `<div><span class="a">Publication</span><span>${c.archived?'Published':'Withheld — source snapshot not yet archived and hashed'}</span></div>`;
  const miss=m=>(c.archive_status.sources_missing[m]||[]).join(', ');
  const line=(label,m,held)=>`<div><span class="a">${label}</span><span>${
    st[m]?(held?`Held — ${held}`:'Published'):`Withheld — not yet archived and hashed: ${miss(m)}`}</span></div>`;
  return line('Publication · water supply','water_supply',null)
       + (c.not_priced?'':line('Publication · total water services','total_water_services',
            c.services_publishable===false?c.services_blocked_by:null));
}

/* the arithmetic — a modal, and treated as one:
   focus enters it, stays inside it, and returns to the control that opened it.
   Closed, it is inert and out of the accessibility tree. */
const scrim=document.getElementById('scrim'), dr=document.getElementById('drawer');
let lastTrigger=null;
function drawer(id,trigger){
  const c=byId(id); if(!c||c.not_priced) return;
  lastTrigger=trigger||document.activeElement;
  const w=c.components.filter(x=>x.stream==='water'), ww=c.components.filter(x=>x.stream==='wastewater');
  document.getElementById('drawerBody').innerHTML=`
   <button class="x" id="closeD">Close ✕</button>
   <div class="ds">The arithmetic</div><h3>${c.name} · one month</h3>
   <div class="ds">15,000 litres · ordinary metered household</div>
   <div class="cl">${w.map(x=>`<div class="ln"><div class="t"><span>${x.name}</span>
      <span class="amt num">${x.monthly.toFixed(2)}</span></div>${x.rate?`<div class="rt">${x.rate}</div>`:''}</div>`).join('')}
     <div class="ln sum"><div class="t"><span>Water</span><span class="amt num">${c.symbol} ${c.bill_month.toFixed(2)}</span></div></div></div>
   ${ww.length&&c.services_publishable!==false?`<div class="cl">${ww.map(x=>`<div class="ln"><div class="t"><span>${x.name}</span>
      <span class="amt num">${x.monthly.toFixed(2)}</span></div>${x.rate?`<div class="rt">${x.rate}</div>`:''}</div>`).join('')}
     <div class="ln sum"><div class="t"><span>Water and wastewater</span><span class="amt num">${c.symbol} ${c.services_month.toFixed(2)}</span></div></div></div>`:''}
   <div class="mt">
     <div><span class="a">Divided by</span><span>15 m³ → ${c.symbol} ${c.price_m3.toFixed(3)} per 1,000 litres</span></div>
     <div><span class="a">Scenario</span><span>${D.scenario}</span></div>
     <div><span class="a">Tariff effective</span><span>${c.tariff_effective}</span></div>
     <div><span class="a">Comparability</span><span>Grade ${c.grade}</span></div>
     ${(c.sources||[]).map(s=>`<div><span class="a">Source</span><span>${s.publisher} — ${s.title}</span></div>`).join('')}
   </div>
   ${c.grade_reason?`<p class="note">${c.grade_reason}</p>`:''}`;
  scrim.classList.add('on'); dr.classList.add('on');
  dr.removeAttribute('inert'); dr.removeAttribute('aria-hidden');
  document.getElementById('closeD').onclick=closeDrawer;
  document.getElementById('closeD').focus();
}
function closeDrawer(){
  if(!dr.classList.contains('on')) return;
  scrim.classList.remove('on'); dr.classList.remove('on');
  dr.setAttribute('inert',''); dr.setAttribute('aria-hidden','true');
  if(lastTrigger&&document.contains(lastTrigger)) lastTrigger.focus();
  lastTrigger=null;
}
dr.setAttribute('inert',''); dr.setAttribute('aria-hidden','true');
scrim.onclick=closeDrawer;
addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeDrawer();return;}
  if(e.key!=='Tab'||!dr.classList.contains('on')) return;
  const f=[...dr.querySelectorAll('button,a[href],[tabindex]:not([tabindex="-1"])')]
    .filter(el=>el.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

 <div><span class="a">Methodology</span><span>${D.methodology.version}, frozen ${D.methodology.frozen_on}${

 <div><span class="a">Scenario</span><span>${D.scenario}</span></div>
 <div><span class="a">Base period</span><span>${D.base_period.id} · month not set. ${D.base_period.blocked_by}</span></div>
 </div></div>`;
head('Methodology — how The Water Journal measures water',
     'Scenario TWJ-R180-v1.0: what one household pays for 15,000 litres a month, calculated the same way in every city, in local currency, with the comparability grade printed beside it.',
     null,'website');
show('method','/methodology');
}

/* disclosure */
function aboutPage(){
document.getElementById('aboutBody').innerHTML=`
<div class="hero"><div class="eyebrow">Editorial independence</div><h1>Who publishes this.</h1>
 <p>The Water Journal is an editorial and data initiative established by Prana Spring, a bottled water brand sold in the United Arab Emirates.</p></div>
<div class="rows">
 ${[['No bottled water index','We publish none, and no ranking of brands.'],
    ['Corrections','Published in a log, never made silently. We have already corrected ourselves once, on Dubai.'],
    ['No claim of being first','Global tariff datasets and city price comparisons exist. What does not exist is one that shows its arithmetic.'],
    ['Append only','A superseded figure is closed with a date and kept. No historical value is recalculated under a later methodology.']]
  .map(r=>`<div><span class="a">${r[0]}</span><span>${r[1]}</span></div>`).join('')}
</div>
<div class="blk"><h4>The corrections log</h4><div class="rows">
 ${(D.corrections||[]).map(c=>`<div><span class="a">${c.recorded}${
   c.kind==='re_stamp'?' · re-stamp':''}${c.article?' · article':''}</span><span>${
   c.article?`<b>${c.article}</b> — `:c.city?`<b>${c.city}</b> · `:''}${
   c.figures_changed===false&&!c.article?'<b>No figure moved.</b> ':''}${
   c.old_value?`“${c.old_value}” → “${c.new_value}”. `:''}${c.reason}${
   c.figures_changed===false&&c.article?' No figure in the article changed.':''}</span></div>`).join('')}
 </div>
 <p class="note">A restatement that leaves every figure unchanged is logged as a
  <b>re-stamp</b> rather than a correction, so the correction count stays a measure of
  wrong figures rather than of wrong descriptions. Both are published. An article whose
  claim went further than its source is a correction even when no number moved — the
  overreach is the error.</p></div>`;
head('Editorial independence — who publishes The Water Journal',
     'The Water Journal is an editorial and data initiative established by Prana Spring. It publishes no bottled water index and no ranking of brands, and corrects itself in a public log.',
     null,'website');
show('about','/independence');
}

/* not found — an address that resolves to nothing says so, and offers the
   addresses that do resolve rather than bouncing the reader to the home page. */
function gone(route){
  document.getElementById('goneBody').innerHTML=`
  <div class="gone"><div class="eyebrow">404</div>
    <h1>There is no page at this address.</h1>
    <p>The address <b>${route.replace(/[<>&]/g,'')}</b> does not resolve. Nothing has been removed — an address that once worked still works, because published figures are closed with a date rather than deleted.</p>
    <div class="rows">
      ${[['Home','/'],['The Journal','/journal'],['Water Index','/water-index'],
         ['Compare','/compare'],['Methodology','/methodology'],['Editorial independence','/independence']]
        .map(r=>`<div><span class="a">${r[0]}</span><span><a class="link" href="${href(r[1])}" data-route="${r[1]}">${r[1]} ${ARR}</a></span></div>`).join('')}
    </div></div>`;
  head('Not found — The Water Journal','This address does not resolve.',null,'website');
  show('404',null);
}

/* boot */
paint(readRoute(),{initial:true,keepScroll:true});
