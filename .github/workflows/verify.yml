name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # The fixtures, the guardrails, the acceptance gate, and — since v1.1 —
      # the freeze itself. test/methodology-sync.test.js reads the frozen
      # document and holds the engine to it, so a rule cannot change in one
      # place and not the others.
      - name: Fixtures, guardrails and the frozen methodology
        run: npm test

      - name: Acceptance gate and public payload
        run: npm run build

      # The previous version of this step could not fail. It fired only when
      # the document was edited, and its condition — that src/engine.js
      # contains the string "Methodology v1" — was satisfied by the engine's
      # own header comment. It also watched the wrong direction: the code
      # changed while the document stood still.
      #
      # The replacement distinguishes the two kinds of methodology edit, which
      # the change policy in §0 already distinguishes and the first attempt at
      # this guard did not:
      #
      #   a frozen constant (§2–§6)  must increment the version and be logged
      #   a fixture figure (§10)     moves when the evidence moves; no bump
      #
      # Singapore went C → B the day PUB's Annex A was obtained. That is the
      # system working, not a methodology change, and a guard that demands a
      # version increment for it teaches people to skip the guard.
      - name: A frozen rule may not change silently
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          echo "$CHANGED" | grep -qE '^(docs/methodology|src/methodology.js)' \
            || { echo "no methodology change"; exit 0; }
          echo "$CHANGED" | grep -q '^src/methodology.js' || {
            echo "the document changed without src/methodology.js — the declared"
            echo "constants and the document must move together"; exit 1; }
          git show "$BASE":src/methodology.js > /tmp/prev.js 2>/dev/null || {
            echo "src/methodology.js is new; nothing to compare"; exit 0; }
          node --input-type=module -e "
            const load = async p => (await import(p)).METHODOLOGY;
            const [prev, now] = await Promise.all([load('/tmp/prev.js'), load('./src/methodology.js')]);
            /* Everything except the fixtures, which live in their own export. */
            const frozen = o => JSON.stringify(o);
            if (frozen(prev) === frozen(now)) {
              console.log('frozen constants unchanged; fixture-only edit, no increment due');
              process.exit(0);
            }
            if (prev.version === now.version) {
              console.error('a frozen constant changed but the version is still ' + now.version);
              console.error('see the change policy in §0: increment and re-stamp');
              process.exit(1);
            }
            console.log('methodology ' + prev.version + ' -> ' + now.version);
          "
          node --input-type=module -e "
            const p = (await import('/tmp/prev.js')).METHODOLOGY;
            const n = (await import('./src/methodology.js')).METHODOLOGY;
            if (JSON.stringify(p) === JSON.stringify(n)) process.exit(0);
            const { readFileSync } = await import('node:fs');
            const log = JSON.parse(readFileSync('data/corrections.json', 'utf8'));
            if (log.corrections.some(c => c.new_value === n.version)) process.exit(0);
            console.error('version ' + n.version + ' has no entry in the corrections log (Rule 7.4)');
            process.exit(1);
          "
